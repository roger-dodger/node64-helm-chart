{{- if include "node64.generateAdminPassword" . }}
{{- $secretName := include "node64.adminSecretName" . }}
{{- /* Reuse the password of an existing Secret so it is only generated once */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := randAlphaNum 24 | b64enc }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "node64.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret on helm uninstall, like the /data volume it belongs to.
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ .Values.adminUser | b64enc | quote }}
  password: {{ $password | quote }}
{{- end }}
